services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Servidor de desarrollo de Vite con recarga en caliente (http://localhost:5173).
  # Para probar el GPS desde un teléfono por la red local, arráncalo con VITE_HTTPS=1.
  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_BACKEND_URL: http://web:5000
      VITE_HTTPS: ${VITE_HTTPS:-0}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - web

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-antojito_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
  frontend_node_modules:
